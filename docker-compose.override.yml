# Auto-loaded by `docker compose` alongside docker-compose.yml for local dev:
# builds images locally instead of pulling from Docker Hub, exposes Postgres,
# and bind-mounts source files for hot-reload (node_modules stays baked in the image).
services:
  postgres:
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # docker-compose.yml (prod) only forwards DATABASE_URL/PORT — dev needs
    # the rest of apps/api/.env (ADMIN_EMAIL, AUTH_DEV_OTP, ...) too.
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/prisma7.config.ts:/app/apps/api/prisma7.config.ts
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ./apps/api/tsconfig.build.json:/app/apps/api/tsconfig.build.json
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/tsconfig.app.json:/app/apps/web/tsconfig.app.json
      - ./packages/shared/src:/app/packages/shared/src

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@cockpit.dev
      PGADMIN_DEFAULT_PASSWORD: cockpit
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
